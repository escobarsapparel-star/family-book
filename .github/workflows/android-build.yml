name: Build Android updater APK
# Rebuild marker: cache-test OAuth package callback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'scripts/**', '.github/workflows/android-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
        working-directory: android-app
      - run: npm test
        working-directory: android-app
      - name: Use known-good v1.4.2 web bundle for recovery APK
        shell: bash
        run: |
          STABLE_REF="62ff7825bbc91d3ccaaff2eff05ec7c7150b3695"
          git checkout "$STABLE_REF" -- js css assets legal index.html family-fun.html manifest.json
      - run: npm run sync:android
        working-directory: android-app
      - run: bash gradlew assembleRelease assembleDebug
        working-directory: android-app/android
      - name: Restore current website files after recovery packaging
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree -- js css assets legal index.html family-fun.html manifest.json
      - name: Read Family Book app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android-app/android/app/build.gradle | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBook-v${{ steps.app_version.outputs.version }}-unsigned-release-sign-with-existing-key
          path: android-app/android/app/build/outputs/apk/release/*unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBook-v${{ steps.app_version.outputs.version }}-cache-test-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish recovery APK beside existing installer
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          TARGET="downloads/FamilyBook-v${VERSION}-cache-test.apk"
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Switch website links only after the new APK has been built and copied.
          python3 - <<'PY'
          from pathlib import Path
          app = Path("js/app.js")
          content = app.read_text()
          content = content.replace("const FB_ANDROID_LATEST_VERSION=\"1.4.5\"", "const FB_ANDROID_LATEST_VERSION=\"1.4.6\"")
          content = content.replace("FamilyBook-v1.4.5-cache-test.apk", "FamilyBook-v1.4.6-cache-test.apk")
          content = content.replace("Download Family Book v1.4.5", "Download Family Book v1.4.6")
          content = content.replace("VERSION 1.4.5", "VERSION 1.4.6")
          content = content.replace("Version 1.4.5 includes Share to FamilyBook, native offline image caching and the latest Google sign-in fixes.", "Version 1.4.6 is a recovery test built from the previously working v1.4.2 app. Automatic web updates are temporarily disabled.")
          content = content.replace("install v1.4.5 over it", "install v1.4.6 over it")
          content = content.replace("Latest Android build · Share to FamilyBook · offline image cache", "Recovery test · stable v1.4.2 interface · updates paused")
          app.write_text(content)
          settings = Path("js/settings.js")
          settings_content = settings.read_text().replace("FamilyBook-v1.4.3-cache-test.apk", "FamilyBook-v1.4.6-cache-test.apk")
          settings.write_text(settings_content)
          PY
          git add "$TARGET" js/app.js js/settings.js
          if git diff --cached --quiet; then
            echo "APK already matches published copy."
            exit 0
          fi
          git commit -m "Publish Family Book v${VERSION} cache test APK"
          git pull --rebase origin main
          git push origin main
