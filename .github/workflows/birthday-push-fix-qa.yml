name: Birthday Push Fix QA

on:
  push:
    branches: [fix/birthday-push-delivery]

permissions:
  contents: read

jobs:
  android-web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Install Android web dependencies
        run: npm ci
        working-directory: android-app
      - name: Run Android updater tests
        run: npm test
        working-directory: android-app
      - name: Prepare Android web bundle
        run: npm run prepare:web
        working-directory: android-app
      - name: Show compatibility bundle info
        run: cat android-app/bundle-info.json
      - name: Verify push bridge bundle
        shell: bash
        run: |
          grep -q "PushNotifications" android-app/www/js/apk-native-bridge.js
          grep -q "register_push_device" android-app/www/js/apk-native-enhancements.js
          grep -q "pushNotificationActionPerformed" android-app/www/js/apk-native-enhancements.js
          echo "Push bridge and registration hooks found."
