name: Build Family Book tap-to-open special event cards APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-book-special-event-on-tap-test.yml"
      - "scripts/patch-original-special-event-on-tap.py"
      - "scripts/assets/fb-native-calendar-recovery.js"
      - "js/event-day.js"
      - "css/event-day.css"
      - "scripts/assets/fb-event-day-selected-preview-method.js"
      - "scripts/assets/fb-event-day-open-on-tap.js"
      - "css/mobile-members-polish.css"

permissions:
  contents: write

jobs:
  build-special-event-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline and build bundled theme
        shell: bash
        run: |
          set -euo pipefail
          echo "7270a0519eb77e2d663b9db8f6545b378364ead2fa2c4536344c29e4abfaff01  downloads/FamilyBook.apk" | sha256sum -c -
          python3 -m py_compile scripts/patch-original-special-event-on-tap.py
          python3 scripts/patch-original-special-event-on-tap.py
          APK=build/special-events-on-tap/FamilyBook-event-cards-on-tap-unsigned.apk
          unzip -p "$APK" assets/public/js/settings.js > /tmp/fb-settings-dark.js
          unzip -p "$APK" assets/public/js/fb-visual-themes.js > /tmp/fb-themes.js
          unzip -p "$APK" assets/public/js/fb-native-visual-theme-settings.js > /tmp/fb-theme-settings.js
          node --check /tmp/fb-settings-dark.js
          node --check /tmp/fb-themes.js
          node --check /tmp/fb-theme-settings.js
          unzip -p "$APK" assets/public/js/event-day.js > /tmp/fb-event-day.js
          unzip -p "$APK" assets/public/js/fb-native-calendar-recovery.js > /tmp/fb-native-calendar-recovery.js
          unzip -p "$APK" assets/public/js/app.js > /tmp/fb-calendar-event-app.js
          node --check /tmp/fb-event-day.js
          unzip -p "$APK" assets/public/js/fb-native-special-event-clicks.js > /tmp/fb-native-special-event-clicks.js
          node --check /tmp/fb-native-special-event-clicks.js
          node --check /tmp/fb-native-calendar-recovery.js
          node --check /tmp/fb-calendar-event-app.js
          python3 - <<'PY'
          from zipfile import ZipFile
          original="downloads/FamilyBook.apk"
          apk="build/special-events-on-tap/FamilyBook-event-cards-on-tap-unsigned.apk"
          with ZipFile(original) as o,ZipFile(apk) as a:
              assert a.testzip() is None
              assert o.read("AndroidManifest.xml")==a.read("AndroidManifest.xml")
              for path in o.namelist():
                  if path.endswith(".dex") or path.startswith("lib/"):
                      assert a.read(path)==o.read(path),path
              settings=a.read("assets/public/js/settings.js").decode()
              theme=a.read("assets/public/js/fb-visual-themes.js").decode()
              html=a.read("assets/public/index.html").decode()
              owner=a.read("assets/public/js/profile-avatar-route.js").decode()
              assert 'appearance:{\n      theme:"dark"\n    }' in settings
              assert 'localStorage.getItem(KEY)||"classic"' in theme
              assert 'localStorage.getItem("fb_visual_theme")||"classic"' in html
              assert 'data-visual-theme="'+chr(36)+'{id}' in theme or "data-visual-theme" in theme
              assert "midnight-aurora" in theme
              assert "fb-settings-ota-updater.js" in html
              assert "fb-mobile-video-controls.js" in html
              assert "fb-platform-owner-activity.js" in html
              assert "admin=String(u.role||'')==='admin'" in owner
              assert "platformOwner=String(u.supabaseUserId||'')" in owner
              assert 'fb-midnight-members.css' in html
              assert 'fb-midnight-apk-route-repairs.css' in html
              membercss=a.read("assets/public/css/fb-midnight-members.css").decode()
              repair=a.read("assets/public/css/fb-midnight-apk-route-repairs.css").decode()
              for selector in ("members-head","members-page","member-card"):
                  assert selector in membercss,selector
              for selector in ("wall-post-head strong","comment-toggle",
                               "button.fb-mobile-gallery-shortcut","fun-gallery-copy strong",
                               "fb-gallery-route-open","fun-gallery-delete"):
                  assert selector in repair,selector
              assert 'html.native-app[data-fb-visual-theme="midnight-aurora"]' in repair
              assert repair.count("{")==repair.count("}"),"Invalid repair CSS braces"
              assert "fb-midnight-android-performance.css" in html
              perf=a.read("assets/public/css/fb-midnight-android-performance.css").decode()
              assert 'html.native-app[data-fb-visual-theme="midnight-aurora"]' in perf
              for selector in ("backdrop-filter:none!important","background-image:none!important","ct-lines path"):
                  assert selector in perf,selector
              assert perf.count("{")==perf.count("}")
              assert html.index("fb-midnight-apk-route-repairs.css")<html.index("fb-midnight-android-performance.css")
              assert "js/event-day.js" in html
              assert "css/event-day.css" in html
              assert "js/fb-native-calendar-recovery.js" in html
              assert "window.FB_EVENT_DAY?.bindRoute?.(r);" in a.read("assets/public/js/app.js").decode()
              assert "view-event:" in a.read("assets/public/js/fb-native-calendar-recovery.js").decode()
              assert "window.FB_EVENT_DAY" in a.read("assets/public/js/event-day.js").decode()
              assert 'js/fb-native-special-event-clicks.js' in html
              art=a.read('assets/public/js/event-day.js').decode()
              nav=a.read('assets/public/js/fb-native-special-event-clicks.js').decode()
              assert 'showWelcome,showSelectedEventCard' in art
              assert 'window.FB_EVENT_DAY?.showSelectedEventCard?.(id)' in nav
              assert 'BIRTHDAY CELEBRATION' in art and 'ANNIVERSARY CELEBRATION' in art
              assert 'window.__fbSkipNativeEventPreview=true;' in art
              assert 'todayRows()' in art
              print("PASS: manual upcoming birthday and anniversary cards open from event detail")
              print("PASS: Calendar special event routes, birthday cards and blank-grid recovery")
              print("PASS: Wall, Fun, Members and Video Gallery repairs present in APK")
              for image in ("midnight-aurora-alpine.webp","midnight-aurora-widget-flow.webp"):
                  content=a.read("assets/public/assets/"+image)
                  assert content[:4]==b"RIFF" and content[8:12]==b"WEBP"
          print("PASS: DARK default, Midnight opt-in, saved preferences preserved")
          print("PASS: owner/admin restrictions and all original native files retained")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4

      - name: Sign and verify separate test package
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=build/special-events-on-tap/FamilyBook-event-cards-on-tap-unsigned.apk
          ALIGNED=build/special-events-on-tap/FamilyBook-event-cards-on-tap-aligned.apk
          mkdir -p downloads
          "$BT/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BT/zipalign" -c -p 4 "$ALIGNED"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 365 \
            -alias familybook-event-card-tap \
            -keystore build/special-events-on-tap/event-card-tap-test.keystore \
            -storepass familybooktest123 -keypass familybooktest123 \
            -dname "CN=Family Book Event Card Tap Test,O=Family Book,C=ZA"
          "$BT/apksigner" sign \
            --ks build/special-events-on-tap/event-card-tap-test.keystore \
            --ks-key-alias familybook-event-card-tap \
            --ks-pass pass:familybooktest123 \
            --key-pass pass:familybooktest123 \
            --out downloads/FamilyBook-special-event-cards-on-tap-test.apk "$ALIGNED"
          "$BT/apksigner" verify --verbose downloads/FamilyBook-special-event-cards-on-tap-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBook-special-event-cards-on-tap-test
          path: downloads/FamilyBook-special-event-cards-on-tap-test.apk

      - name: Publish separate APK without replacing the release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/FamilyBook-special-event-cards-on-tap-test.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Family Book manual special event celebration cards test APK"
          git pull --rebase origin main
          git push origin main
