name: Publish Android interface updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-web-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Family Book social preview
        shell: bash
        run: |
          shopt -s nullglob
          parts=(assets/images/.social-preview-part-*)
          if [ ${#parts[@]} -eq 0 ]; then
            exit 0
          fi
          cat "${parts[@]}" | base64 -d > assets/images/family-book-social-share-v3.jpg
          rm -f "${parts[@]}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace(
              "https://familybook.co.za/assets/images/family-book-social-share.jpg?v=20260926-2",
              "https://familybook.co.za/assets/images/family-book-social-share-v3.jpg?v=20260926-3",
          )
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images index.html
          git commit -m "Deploy improved social preview image"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - run: npm ci
        working-directory: android-app
      - run: npm test
        working-directory: android-app
      - run: node scripts/prepare-android.mjs
      - run: python3 scripts/package-android-update.py
      - name: Publish bundle, then update feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUNTIME=$(node -p "require('./android-app/bundle-info.json').runtime")
          VERSION=$(node -p "require('./android-app/bundle-info.json').version")
          TAG="android-web-$RUNTIME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Android interface updates ($RUNTIME)" --notes "Automatic interface updates for compatible Family Book Android builds. Existing APKs without the updater must be rebuilt once. ZIP files are update bundles, not APK installers." --latest=false
          gh release upload "$TAG" "android-app/release/$VERSION.zip" --clobber
          gh release upload "$TAG" android-app/release/latest.json --clobber

          # One-time compatibility bridges for updater-enabled test APKs that
          # were built before the stable runtime fingerprint ignored version
          # metadata. The downloaded bundle contains the NEW runtime, so after
          # restart those installs move themselves onto the stable feed.
          for LEGACY_RUNTIME in 4586e6b855de1e75d33c de495001b6500ae82a19; do
            if [ "$LEGACY_RUNTIME" = "$RUNTIME" ]; then
              continue
            fi
            python3 scripts/package-android-compat.py "$LEGACY_RUNTIME"
            LEGACY_TAG="android-web-$LEGACY_RUNTIME"
            gh release view "$LEGACY_TAG" >/dev/null 2>&1 || gh release create "$LEGACY_TAG" --target "$GITHUB_SHA" --title "Android interface updates ($LEGACY_RUNTIME)" --notes "Compatibility update feed for existing Family Book Android test builds." --latest=false
            gh release upload "$LEGACY_TAG" "android-app/release/$VERSION.zip" --clobber
            gh release upload "$LEGACY_TAG" "android-app/release/compat/$LEGACY_RUNTIME/latest.json" --clobber
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-interface-update
          path: android-app/release/
