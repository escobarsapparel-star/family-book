name: Package FamilyBook CapCut assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-marketing-assets.yml"
      - "marketing/screenshots/**"
      - "marketing/brand-guide.txt"
      - "assets/logo/**"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ZIP
        run: |
          rm -rf /tmp/FamilyBook_CapCut_Assets
          mkdir -p /tmp/FamilyBook_CapCut_Assets/logos /tmp/FamilyBook_CapCut_Assets/screenshots
          cp assets/logo/family-book-logo.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo.png
          cp assets/logo/family-book-logo-header.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo-header.png
          cp assets/logo/family-book-logo-dark-header.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo-dark-header.png
          cp marketing/screenshots/*.png /tmp/FamilyBook_CapCut_Assets/screenshots/
          cp marketing/brand-guide.txt /tmp/FamilyBook_CapCut_Assets/brand-guide.txt
          printf '%s\n' \
            'FamilyBook CapCut Marketing Asset Pack' \
            '' \
            'Public demo: https://familybook.co.za/demo/' \
            'Brand: FamilyBook' \
            'Tagline: Our family. Our memories. Our story.' \
            'Font: Inter' \
            'Demo data: Fictional Williams Family only.' \
            '' \
            'Use these real FamilyBook assets and screenshots rather than inventing interface screens.' \
            > /tmp/FamilyBook_CapCut_Assets/README.txt
          python3 - <<'PY'
          import os, zipfile
          root="/tmp/FamilyBook_CapCut_Assets"
          out="marketing/FamilyBook_CapCut_Assets.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for base,_,files in os.walk(root):
                  for name in files:
                      full=os.path.join(base,name)
                      arc=os.path.relpath(full,os.path.dirname(root))
                      z.write(full,arc)
          print(out, os.path.getsize(out))
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBook_CapCut_Assets
          path: marketing/FamilyBook_CapCut_Assets.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish ZIP to website
        run: |
          git config user.name "FamilyBook Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing/FamilyBook_CapCut_Assets.zip
          if git diff --cached --quiet; then
            echo "ZIP already current."
            exit 0
          fi
          git commit -m "Publish FamilyBook CapCut asset ZIP [skip ci]"
          git pull --rebase origin main
          git push origin main
