name: Midnight Aurora preview QA

on:
  push:
    branches: [midnight-aurora-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/familybook-preview-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/demo/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/familybook-preview-http.log
          exit 1
      - name: Test Midnight preview navigation
        run: node scripts/qa-midnight-preview.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-preview-qa
          path: |
            midnight-preview-qa.png
            midnight-preview-qa-failure.png
            midnight-preview-browser.log
          if-no-files-found: ignore
