name: Capture FamilyBook marketing media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketing-capture.yml"
      - "scripts/marketing/**"
      - "demo/**"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "index.html"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Prepare marketing folders and official logos
        run: |
          mkdir -p marketing/screenshots

      - name: Start local FamilyBook server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/familybook-http.log 2>&1 &
          echo $! > /tmp/familybook-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/demo/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/familybook-http.log
          exit 1

      - name: Capture real Guest Demo screens and navigation recording
        run: node scripts/marketing/capture-demo.mjs

      - name: Verify media
        run: |
          test -f marketing/screenshots/01-dashboard-navigation.png
          test -f marketing/screenshots/09-family-camera.png
          file marketing/screenshots/*.png

      - name: Build CapCut asset ZIP
        run: |
          rm -rf /tmp/FamilyBook_CapCut_Assets
          mkdir -p /tmp/FamilyBook_CapCut_Assets/logos /tmp/FamilyBook_CapCut_Assets/screenshots
          cp assets/logo/family-book-logo.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo.png
          cp assets/logo/family-book-logo-header.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo-header.png
          cp assets/logo/family-book-logo-dark-header.png /tmp/FamilyBook_CapCut_Assets/logos/family-book-logo-dark-header.png
          cp marketing/screenshots/*.png /tmp/FamilyBook_CapCut_Assets/screenshots/
          cp marketing/brand-guide.txt /tmp/FamilyBook_CapCut_Assets/brand-guide.txt
          cat > /tmp/FamilyBook_CapCut_Assets/README.txt <<'EOF'
FamilyBook CapCut Marketing Asset Pack

Public demo: https://familybook.co.za/demo/
Brand: FamilyBook
Tagline: Our family. Our memories. Our story.
Font: Inter
Demo data: Fictional Williams Family only.

Contents:
- Official FamilyBook PNG logos
- 1920x1080 screenshots captured from the real public Guest Demo
- Brand guide

Use these real assets rather than recreating or inventing FamilyBook interface screens.
EOF
          python3 - <<'PY'
          import os, zipfile
          root="/tmp/FamilyBook_CapCut_Assets"
          out="marketing/FamilyBook_CapCut_Assets.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for base,_,files in os.walk(root):
                  for name in files:
                      full=os.path.join(base,name)
                      arc=os.path.relpath(full,os.path.dirname(root))
                      z.write(full,arc)
          print(out, os.path.getsize(out))
          PY
          test -f marketing/FamilyBook_CapCut_Assets.zip

      - name: Commit generated marketing media
        run: |
          git config user.name "FamilyBook Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing/screenshots marketing/FamilyBook_CapCut_Assets.zip
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Generate FamilyBook marketing media [skip ci]"
          git pull --rebase origin main
          git push origin main
